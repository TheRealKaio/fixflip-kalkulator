<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><script>if(window.self===window.top)location.replace('./#account');</script><title>Deine Nutzerdaten | Neustart ImmoCheck</title><link rel="stylesheet" href="admin.css"><script src="site-settings.js" defer></script><script src="user-data.js" defer></script><style>html,body{min-height:0;height:auto;background:#fff!important}body.nic-admin{min-height:0!important;background:#fff!important}.admin-shell{min-height:0;box-sizing:border-box}.email-change-row{display:flex;gap:10px;align-items:stretch}.email-change-row input{flex:1;min-width:0}.email-change-row button{flex:none;border:0;border-radius:11px;padding:10px 14px;background:var(--nic-button-bg,#0f172a);color:var(--nic-button-text,#fff);font-weight:700}body .admin-header,body .admin-heading{display:none}.admin-shell{padding:0 16px;max-width:640px}.user-data-card{max-width:640px}.delete-account-choice{display:flex;align-items:center;gap:10px;margin:32px 0 0;font-size:var(--nic-hint-font-size,12px);cursor:pointer}.delete-account-choice input{appearance:auto;flex:0 0 10px;width:10px;height:10px;min-width:10px;min-height:10px;margin:0;padding:0}.user-data-actions{display:flex;gap:12px;margin-top:24px}.user-data-actions button{border:0;border-radius:11px;padding:12px 22px;background:var(--nic-button-bg,#0f172a);color:var(--nic-button-text,#fff);font-weight:700}</style></head>
<body class="nic-admin"><div class="admin-shell"><header class="admin-header"><a class="brand" href="./">Neustart <span>ImmoCheck</span></a><a class="back-link" href="./">← Zu den Kalkulatoren</a></header><main><div class="admin-heading"><div><h1>Deine Nutzerdaten</h1><p class="lead">Hier kannst du deine Daten ändern oder dein Benutzerkonto unwiderruflich löschen.</p></div></div><p id="profileStatus" role="status" aria-live="polite">Deine Daten werden geladen …</p><form id="profileForm" class="form-card user-data-card" hidden><div class="field-grid"><div class="admin-field"><label for="firstName">Vorname</label><input id="firstName" name="first_name" autocomplete="given-name" maxlength="100" required></div><div class="admin-field"><label for="lastName">Nachname</label><input id="lastName" name="last_name" autocomplete="family-name" maxlength="100" required></div><div class="admin-field wide"><label for="profileEmail">E-Mail</label><div class="email-change-row"><input id="profileEmail" type="email" autocomplete="email" readonly><button id="changeEmail" type="button">Email ändern</button></div><span class="helper">Deine bestätigte E-Mail-Adresse für die Anmeldung.</span></div></div><div class="user-data-actions"><button type="submit">Änderungen speichern</button><button id="profileLogout" type="button">Abmelden</button></div><label class="delete-account-choice"><input id="deleteAccount" type="checkbox"><span>Deine Daten löschen (unwiderruflich)</span></label></form></main></div></body></html>
