name: Deploy FixFlip to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site
        run: |
          mkdir -p _site
          cat source/index.html.gz.b64.part* > /tmp/index.b64
          base64 -d /tmp/index.b64 > /tmp/index.html.gz
          gunzip -c /tmp/index.html.gz > _site/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          old = "input,select{width:100%;min-height:50px;border:1.5px solid #d9dee7;border-radius:14px;background:#fbfcfe;color:var(--ink);padding:0 44px 0 14px;font-size:17px;font-weight:650;outline:none}"
          new = "input,select{width:100%;height:50px;min-height:50px;border:1.5px solid #d9dee7;border-radius:14px;background:#fbfcfe;color:var(--ink);padding:0 44px 0 14px;font-size:17px;font-weight:650;outline:none}"
          if old not in s:
              raise SystemExit("Safari select CSS target not found")
          s = s.replace(old, new, 1).replace("V8.152", "V8.153")
          p.write_text(s, encoding="utf-8")
          PY
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
