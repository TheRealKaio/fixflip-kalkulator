name: GitHub Entwicklungsvorschau

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    outputs:
      artifact_name: ${{ steps.preview_artifact.outputs.name }}
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build and verify website
        uses: ./.github/actions/build-site
      - name: Prepare isolated project preview
        run: |
          python -m unittest discover -s scripts -p test_github_preview.py
          python scripts/prepare_github_preview.py --live-layout
      - name: Verify preview navigation and backend isolation
        run: NODE_PATH=/tmp/nic-browser/node_modules node scripts/verify_github_preview.cjs
      - name: Name verified preview artifact
        id: preview_artifact
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.preview_artifact.outputs.name }}
          path: _preview

  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check independent Pages address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nic_cname="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""')"
          if [[ -n "$nic_cname" ]]; then
            echo '::error::GitHub Settings > Pages > Custom domain: bisherige Domain entfernen. STRATO-DNS unveraendert lassen.'
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
