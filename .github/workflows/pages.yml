name: Deploy FixFlip to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Fallback for API/App commits that may not emit a normal push-triggered run.
  # The scheduled run always builds the current main branch and is protected
  # by the same verifier/deployment gates as every other run.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site
        run: |
          mkdir -p _site
          cat source/index.html.gz.b64.part* > /tmp/index.b64
          base64 -d /tmp/index.b64 > /tmp/index.html.gz
          gunzip -c /tmp/index.html.gz > _site/index.html
          cp service-worker.js _site/service-worker.js
          printf 'www.neustart-immocheck.de\n' > _site/CNAME

