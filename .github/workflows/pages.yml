name: Deploy FixFlip to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site
        run: |
          mkdir -p _site
          cat source/index.html.gz.b64.part* > /tmp/index.b64
          base64 -d /tmp/index.b64 > /tmp/index.html.gz
          gunzip -c /tmp/index.html.gz > _site/index.html
          cp service-worker.js _site/service-worker.js

          python - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")

          s = s.replace('<meta name="apple-mobile-web-app-title" content="Fix&Flip">','<meta name="apple-mobile-web-app-title" content="Neustart ImmoCheck">')
          s = s.replace('<meta name="apple-mobile-web-app-title" content="Fix & Flip">','<meta name="apple-mobile-web-app-title" content="Neustart ImmoCheck">')
          s = s.replace('<title>Fix & Flip Deal Check</title>','<title>Neustart ImmoCheck</title>')

          old_css = "input,select{width:100%;min-height:50px;border:1.5px solid #d9dee7;border-radius:14px;background:#fbfcfe;color:var(--ink);padding:0 44px 0 14px;font-size:17px;font-weight:650;outline:none}"
          new_css = "input,select{width:100%;height:50px;min-height:50px;border:1.5px solid #d9dee7;border-radius:14px;background:#fbfcfe;color:var(--ink);padding:0 44px 0 14px;font-size:17px;font-weight:650;outline:none}"
          if old_css in s:
              s = s.replace(old_css,new_css,1)

          old_field = '<div class="field"><label>Sicherheitsreserve <span class="hint">monatlich</span></label><div class="input-wrap"><input id="budgetSafetyReserve" inputmode="decimal" value="300"><span class="unit">€</span></div></div>'
          new_field = '<div class="field"><label>Sicherheitsreserve</label><div class="input-wrap"><input id="budgetSafetyReserve" inputmode="decimal" value="300"><span class="unit">€</span></div><div class="mini">monatlich</div></div>'
          if old_field in s:
              s = s.replace(old_field,new_field,1)

          replacements = {
              'id="budgetNetIncome" inputmode="decimal" value="4500"': 'id="budgetNetIncome" inputmode="decimal" value="0"',
              '<option value="single">Single</option>\n              <option value="couple" selected>Paar</option>': '<option value="single" selected>Single</option>\n              <option value="couple">Paar</option>',
              'id="budgetIncomeEmployment" inputmode="decimal" value="4500"': 'id="budgetIncomeEmployment" inputmode="decimal" value="0"',
              '<option value="1">1</option>\n              <option value="2" selected>2</option>': '<option value="1" selected>1</option>\n              <option value="2">2</option>',
              '<option value="0">0</option><option value="1">1</option><option value="2" selected>2</option>': '<option value="0" selected>0</option><option value="1">1</option><option value="2">2</option>',
              'id="budgetChildBenefit" inputmode="decimal" value="518"': 'id="budgetChildBenefit" inputmode="decimal" value="0"',
              'id="budgetEquity" inputmode="decimal" value="100000"': 'id="budgetEquity" inputmode="decimal" value="0"',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Default target not found: {old}")
              s = s.replace(old,new,1)

          brand_css = '.brand{font-weight:800;letter-spacing:-.02em;font-size:20px}'
          brand_css_new = brand_css + '\n.brand-logo-wrap{display:flex;align-items:center;background:#fff;border-radius:13px;padding:6px 9px;box-shadow:0 5px 16px rgba(0,0,0,.12)}\n.brand-logo{display:block;width:190px;max-width:46vw;height:auto}\n@media(max-width:430px){.brand-logo{width:172px;max-width:50vw}.brand-logo-wrap{padding:5px 8px}.hero-top{gap:10px}.tag{font-size:11px;padding:6px 9px}}'
          if brand_css in s:
              s = s.replace(brand_css,brand_css_new,1)

          old_hero = '<div class="hero-top"><div class="brand">Fix & Flip</div><div class="tag">Deal Check</div></div>'
          logo_svg = Path("neustart-immocheck-logo.svg").read_text(encoding="utf-8")
          logo_svg = logo_svg.replace('<svg xmlns="http://www.w3.org/2000/svg"', '<svg class="brand-logo" xmlns="http://www.w3.org/2000/svg"', 1)
          new_hero = '<div class="hero-top"><div class="brand-logo-wrap">' + logo_svg + '</div></div>'
          if old_hero not in s:
              raise SystemExit("Hero branding target not found")
          s = s.replace(old_hero,new_hero,1)

          needle = '''function pdfPercent(n){
            return new Intl.NumberFormat("de-DE",{maximumFractionDigits:1}).format(n) + " %";
          }
          '''
          logo_svg_js = logo_svg.replace('\\`','\\\\`').replace('${','\\${')
          insert = needle + '''
          const BRAND_DOMAIN = "neustart-immocheck.de";
          const BRAND_LOGO_SVG = String.raw`__BRAND_LOGO_SVG__`;
          let BRAND_LOGO_PNG = "";

          async function preparePdfBrandLogo(){
            if(BRAND_LOGO_PNG) return BRAND_LOGO_PNG;
            const svgData = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(BRAND_LOGO_SVG);
            BRAND_LOGO_PNG = await new Promise((resolve,reject)=>{
              const img = new Image();
              img.onload = ()=>{
                try{
                  const canvas=document.createElement("canvas");
                  canvas.width=1800;
                  canvas.height=680;
                  const ctx=canvas.getContext("2d");
                  ctx.fillStyle="#ffffff";
                  ctx.fillRect(0,0,canvas.width,canvas.height);
                  ctx.drawImage(img,0,0,canvas.width,canvas.height);
                  resolve(canvas.toDataURL("image/png"));
                }catch(err){ reject(err); }
              };
              img.onerror=()=>reject(new Error("SVG-Logo konnte nicht fuer den PDF-Bericht vorbereitet werden."));
              img.src=svgData;
            });
            return BRAND_LOGO_PNG;
          }

          function drawPdfBrandLogo(doc){
            const left=16;
            doc.setFillColor(255,255,255);
            doc.roundedRect(left,5,58,24,3,3,"F");
            try{
              if(BRAND_LOGO_PNG) doc.addImage(BRAND_LOGO_PNG,"PNG",left+2,7,54,20,undefined,"FAST");
            }catch(e){}
          }

          function drawPdfBrandHeader(doc, reportTitle, subtitle, dateText){
            const left=16, right=194;
            doc.setFillColor(15,23,42);
            doc.rect(0,0,210,34,"F");
            drawPdfBrandLogo(doc);
            doc.setTextColor(255,255,255);
            doc.setFont("helvetica","bold");
            doc.setFontSize(14);
            doc.text(pdfSafeText(reportTitle),80,14);
            doc.setFont("helvetica","normal");
            doc.setFontSize(8.2);
            const subLines=doc.splitTextToSize(pdfSafeText(subtitle),108);
            doc.text(subLines.slice(0,2),80,20);
            if(dateText){
              doc.setFontSize(7.5);
              doc.text(pdfSafeText(dateText),right,29,{align:"right"});
            }
            doc.setTextColor(23,32,51);
          }

          function drawPdfFooter(doc, pageNo, totalPages, version){
            doc.setFont("helvetica","normal");
            doc.setFontSize(7.5);
            doc.setTextColor(100,110,125);
            doc.text(BRAND_DOMAIN,16,289);
            if(version) doc.text(version,105,289,{align:"center"});
            if(pageNo && totalPages) doc.text("Seite " + pageNo + " von " + totalPages,194,289,{align:"right"});
            doc.setTextColor(23,32,51);
          }
          '''
          insert = insert.replace("__BRAND_LOGO_SVG__", logo_svg_js)
          if needle not in s:
              raise SystemExit("PDF helper target not found")
          s = s.replace(needle,insert,1)

          old_budget_y = '''  let y=18;

            function title(t){
              doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(23,32,51);
              doc.text(pdfSafeText(t),left,y); y+=8;
            }'''
          new_budget_y = '''  let y=43;

            function title(t){
              doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(23,32,51);
              doc.text(pdfSafeText(t),left,y); y+=8;
            }'''
          if old_budget_y not in s:
              raise SystemExit("Budget Y target not found")
          s = s.replace(old_budget_y,new_budget_y,1)

          old_budget_title = '''  title("Budget - Wie viel Immobilie kann ich mir leisten?");
            doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(100,110,125);
            doc.text("Orientierungsrechnung - keine Finanzierungszusage",left,y); y+=8;'''
          new_budget_title = '''  drawPdfBrandHeader(doc,"Budget - Immobilien-Report","Wie viel Immobilie kann ich mir leisten?",new Date().toLocaleDateString("de-DE"));

            const budgetPdfNorm = (value) => String(value ?? "").replace(/\\s+/g," ").trim();
            const budgetPdfFieldValue = (labelPart) => {
              const wanted = budgetPdfNorm(labelPart).toLowerCase();
              for(const field of Array.from(document.querySelectorAll(".field"))){
                const label = field.querySelector("label");
                if(!label || !budgetPdfNorm(label.textContent).toLowerCase().includes(wanted)) continue;
                const control = field.querySelector("select,input");
                if(!control) continue;
                if(control.tagName === "SELECT"){
                  const option = control.options && control.selectedIndex >= 0 ? control.options[control.selectedIndex] : null;
                  return budgetPdfNorm(option ? option.textContent : control.value) || "-";
                }
                return budgetPdfNorm(control.value) || "-";
              }
              return "-";
            };
            const budgetPdfResultValue = (labelPart) => {
              const wanted = budgetPdfNorm(labelPart).toLowerCase();
              for(const card of Array.from(document.querySelectorAll(".budget-result-card"))){
                const name = card.querySelector(".name");
                if(!name || !budgetPdfNorm(name.textContent).toLowerCase().includes(wanted)) continue;
                const value = card.querySelector(".value");
                if(value) return budgetPdfNorm(value.textContent) || "-";
              }
              return "-";
            };
            const budgetPdfInputNumber = (id) => {
              const el = document.getElementById(id);
              if(!el) return 0;
              const raw = String(el.value ?? "").trim().replace(/\\./g,"").replace(",",".").replace(/[^0-9.-]/g,"");
              const n = Number(raw);
              return Number.isFinite(n) ? n : 0;
            };
            const budgetPdfEuro = (n) => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(n)||0);
            const budgetPdfPct = (id) => {
              const n = budgetPdfInputNumber(id);
              return new Intl.NumberFormat("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n) + " %";
            };
            const budgetPdfCard = (x, yy, w, h, label, value) => {
              doc.setFillColor(247,249,252);
              doc.setDrawColor(225,229,236);
              doc.roundedRect(x,yy,w,h,2.5,2.5,"FD");
              doc.setFont("helvetica","normal"); doc.setFontSize(7.2); doc.setTextColor(100,110,125);
              doc.text(pdfSafeText(label),x+4,yy+6);
              doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(23,32,51);
              const valueLines=doc.splitTextToSize(pdfSafeText(value || "-"),w-8);
              doc.text(valueLines.slice(0,2),x+4,yy+13);
            };

            doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(23,32,51);
            doc.text("Handlungsempfehlung | Kurzfazit",left,y); y+=6;
            const recommendation = "Kaufe nicht die Immobilie, die dir die Bank maximal finanziert, sondern die Immobilie, die du dir langfristig und entspannt leisten kannst. Eine Immobilienfinanzierung ist häufig eine Verpflichtung über 20 bis 35 Jahre. Deshalb sollte man nicht nur auf den Zinssatz schauen, sondern auf die gesamte finanzielle Situation. Berücksichtige zur Überbrückung von Notar, Grundbuch etc. das notwendige Eigenkapital, da häufig schon Rechnungen fällig werden, bevor die Bank eine Auszahlung getätigt hat.";
            const recommendationLines = doc.splitTextToSize(pdfSafeText(recommendation),contentW-10);
            const recommendationH = Math.max(34, 10 + recommendationLines.length * 4);
            doc.setFillColor(246,248,251); doc.setDrawColor(216,222,231);
            doc.roundedRect(left,y,contentW,recommendationH,3,3,"FD");
            doc.setFont("helvetica","normal"); doc.setFontSize(8.2); doc.setTextColor(55,65,81);
            doc.text(recommendationLines,left+5,y+7);
            y += recommendationH + 9;

            const familyStatus = budgetPdfFieldValue("Familienstatus");
            const adults = budgetPdfFieldValue("Erwachsene");
            const children = budgetPdfFieldValue("Kinder");
            doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(23,32,51);
            doc.text("Wichtigste Ergebnisse auf einen Blick",left,y); y+=5;
            doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(155,163,175);
            doc.text(pdfSafeText("Familienstatus: " + familyStatus + "  |  Erwachsene: " + adults + "  |  Kinder: " + children),left,y); y+=6;

            const maxLoan = budgetPdfResultValue("Max. Darlehen") !== "-" ? budgetPdfResultValue("Max. Darlehen") : budgetPdfResultValue("Darlehen");
            const freeBudget = budgetPdfResultValue("Frei verfügbares Monatsbudget") !== "-" ? budgetPdfResultValue("Frei verfügbares Monatsbudget") : budgetPdfResultValue("Monatsbudget");
            const equity = budgetPdfEuro(budgetPdfInputNumber("budgetEquity"));
            const interest = budgetPdfPct("budgetInterest");
            const repayment = budgetPdfPct("budgetRepayment");
            const gap=3;
            const cardW=(contentW-gap*2)/3;
            budgetPdfCard(left,y,cardW,24,"Maximales Darlehen",maxLoan);
            budgetPdfCard(left+cardW+gap,y,cardW,24,"Zinssatz",interest);
            budgetPdfCard(left+(cardW+gap)*2,y,cardW,24,"Tilgung",repayment);
            y += 28;
            const wideW=(contentW-gap)/2;
            budgetPdfCard(left,y,wideW,24,"Eigenkapital",equity);
            budgetPdfCard(left+wideW+gap,y,wideW,24,"Frei verfügbares Monatsbudget",freeBudget);

            doc.addPage();
            drawPdfBrandHeader(doc,"Budget - Immobilien-Report","Finanzierungsdetails",new Date().toLocaleDateString("de-DE"));
            y=43;'''
          if old_budget_title not in s:
              raise SystemExit("Budget header target not found")
          s = s.replace(old_budget_title,new_budget_title,1)

          old_budget_footer = '''  doc.setFont("helvetica","normal"); doc.setFontSize(8);
            doc.text("V8.152",right,289,{align:"right"});'''
          if old_budget_footer not in s:
              raise SystemExit("Budget footer target not found")
          s = s.replace(old_budget_footer,'  drawPdfBrandLogo(doc);' + chr(10) + '  drawPdfFooter(doc,1,1,"V8.236");',1)

          old_add_page = '''  const addPage = () => {
              doc.addPage();
              y = 18;
            };'''
          new_add_page = '''  const addPage = (reportTitle=null, subtitle=null) => {
              doc.addPage();
              drawPdfBrandHeader(
                doc,
                reportTitle || (isOwnUse ? "Eigennutzung - Deal Report" : "Fix & Flip - Deal Report"),
                subtitle || (isOwnUse ? "Erstellt aus der Eigennutzungs-Kalkulation" : "Erstellt aus der Fix & Flip Kalkulation"),
                new Date().toLocaleDateString("de-DE")
              );
              y = 43;
            };'''
          if old_add_page not in s:
              raise SystemExit("addPage target not found")
          s = s.replace(old_add_page,new_add_page,1)

          old_deal_header = '''  doc.setFillColor(15,23,42);
            doc.rect(0,0,210,34,"F");
            doc.setTextColor(255,255,255);
            doc.setFont("helvetica","bold");
            doc.setFontSize(20);
            doc.text(isOwnUse ? "Eigennutzung - Deal Report" : "Fix & Flip - Deal Report", left, 16);
            doc.setFont("helvetica","normal");
            doc.setFontSize(9);
            doc.text(isOwnUse ? "Erstellt aus der Eigennutzungs-Kalkulation" : "Erstellt aus der Fix & Flip Kalkulation", left, 23);
            doc.text(new Date().toLocaleDateString("de-DE"), right, 23, {align:"right"});
            doc.setTextColor(23,32,51);
            y = 43;'''
          new_deal_header = '''  drawPdfBrandHeader(doc, isOwnUse ? "Eigennutzung - Deal Report" : "Fix & Flip - Deal Report", isOwnUse ? "Erstellt aus der Eigennutzungs-Kalkulation" : "Erstellt aus der Fix & Flip Kalkulation", new Date().toLocaleDateString("de-DE"));
            y = 43;'''
          if old_deal_header in s:
              s = s.replace(old_deal_header,new_deal_header,1)

          old_page_footer = '''    doc.setFont("helvetica","normal");
              doc.setFontSize(8);
              doc.setTextColor(100,110,125);
              doc.text("Seite " + pageNo + " von " + totalPages, right, 289, {align:"right"});'''
          if old_page_footer in s:
              s = s.replace(old_page_footer,'    drawPdfFooter(doc,pageNo,totalPages,"V8.236");',1)

          old_checklist_header = '''  // Abschlussseite: Checkliste zu den wichtigsten Kostentreibern.
            addPage();

            doc.setFillColor(15,23,42);
            doc.rect(0,0,210,34,"F");
            doc.setTextColor(255,255,255);
            doc.setFont("helvetica","bold");
            doc.setFontSize(18);
            doc.text("Checkliste vor dem Immobilienkauf", left, 16);
            doc.setFont("helvetica","normal");
            doc.setFontSize(9);
            doc.text("Wichtige Kostentreiber vor Kauf und Sanierung pruefen", left, 23);
            doc.setTextColor(23,32,51);
            y = 43;'''
          new_checklist_header = '''  // Abschlussseite: Checkliste zu den wichtigsten Kostentreibern.
            // Eigene Ueberschrift, aber dieselbe Marken-Kopfzeile mit Logo wie auf allen anderen Seiten.
            addPage("Checkliste vor dem Immobilienkauf", "Wichtige Kostentreiber vor Kauf und Sanierung pruefen");'''
          if old_checklist_header in s:
              s = s.replace(old_checklist_header,new_checklist_header,1)

          # Robust patch for the first page of Fix & Flip / Eigennutzung.
          first_page_header_old = "\n".join([
              '  doc.setFillColor(15,23,42);',
              '  doc.rect(0,0,210,34,"F");',
              '  doc.setTextColor(255,255,255);',
              '  doc.setFont("helvetica","bold");',
              '  doc.setFontSize(20);',
              '  doc.text(isOwnUse ? "Eigennutzung - Deal Report" : "Fix & Flip - Deal Report", left, 16);',
              '  doc.setFont("helvetica","normal");',
              '  doc.setFontSize(9);',
              '  doc.text(isOwnUse ? "Erstellt aus der Eigennutzungs-Kalkulation" : "Erstellt aus dem Fix & Flip Deal Check", left, 23);',
              '  doc.text(new Date().toLocaleDateString("de-DE"), right, 23, {align:"right"});',
              '  doc.setTextColor(23,32,51);',
              '  y = 43;'
          ])
          first_page_header_new = "\n".join([
              '  drawPdfBrandHeader(',
              '    doc,',
              '    isOwnUse ? "Eigennutzung - Deal Report" : "Fix & Flip - Deal Report",',
              '    isOwnUse ? "Erstellt aus der Eigennutzungs-Kalkulation" : "Erstellt aus der Fix & Flip Kalkulation",',
              '    new Date().toLocaleDateString("de-DE")',
              '  );',
              '  y = 43;'
          ])
          if first_page_header_old in s:
              s = s.replace(first_page_header_old, first_page_header_new, 1)

          # Final safeguard: stamp the logo on every finished deal-report page.
          footer_loop_old = "\n".join([
              '  for(let pageNo = 1; pageNo <= totalPages; pageNo++){',
              '    doc.setPage(pageNo);',
              '    drawPdfFooter(doc,pageNo,totalPages,"V8.236");',
              '  }'
          ])
          footer_loop_new = "\n".join([
              '  for(let pageNo = 1; pageNo <= totalPages; pageNo++){',
              '    doc.setPage(pageNo);',
              '    drawPdfBrandLogo(doc);',
              '    drawPdfFooter(doc,pageNo,totalPages,"V8.236");',
              '  }'
          ])
          if footer_loop_old in s:
              s = s.replace(footer_loop_old, footer_loop_new, 1)

          s = s.replace("V8.152","V8.236")
          final_loop_old = '''  for(let pageNo = 1; pageNo <= totalPages; pageNo++){
            doc.setPage(pageNo);
            drawPdfFooter(doc,pageNo,totalPages,"V8.236");
          }'''
          final_loop_new = '''  for(let pageNo = 1; pageNo <= totalPages; pageNo++){
            doc.setPage(pageNo);
            // Abschluss-Pass: Logo auf jeder Seite nochmals zeichnen, insbesondere Seite 1.
            drawPdfBrandLogo(doc);
            drawPdfFooter(doc,pageNo,totalPages,"V8.236");
          }'''
          if final_loop_old in s:
              s = s.replace(final_loop_old,final_loop_new,1)
          s = s.replace('    const doc = buildPdf();','    await preparePdfBrandLogo();' + chr(10) + '    const doc = buildPdf();',2)
          s = s.replace('navigator.serviceWorker.register("./service-worker.js")','navigator.serviceWorker.register("./service-worker.js?v=8.236", {updateViaCache:"none"})')

          p.write_text(s,encoding="utf-8")
          PY
          python scripts/patch_v8165.py _site/index.html
          python scripts/patch_reno_suggestions.py
          python scripts/patch_budget_placeholders_v8239.py
          python scripts/patch_suggestion_totals_v8240.py
          python scripts/patch_reno_state_v8241.py
          python scripts/patch_budget_reno_v8242.py
          python scripts/patch_buffer_hint.py
          python scripts/patch_market_value_v8243.py
          python scripts/patch_market_value_hint_v8244.py
          python scripts/patch_own_sections_v8245.py
          python scripts/add_wordpress_embed.py _site/index.html

          # Fail the deployment when an inline JavaScript syntax error slips into the generated HTML.
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("_site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          Path("/tmp/fixflip-inline.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/fixflip-inline.js

          # Product acceptance: test the generated site against the actual slider requirement.
          python scripts/verify_budget_slider.py _site/index.html

          # Deployment gate: fail the build unless the generated site actually contains
          # the version and UI changes expected for this release.
          python - <<'PY'
          from pathlib import Path

          index = Path("_site/index.html").read_text(encoding="utf-8")
          sw = Path("_site/service-worker.js").read_text(encoding="utf-8")

          checks = {
              "visible/PDF version V8.245": "V8.245" in index,
              "service-worker registration V8.245": 'service-worker.js?v=8.245' in index,
              "service-worker cache version V8.245": "neustart-immocheck-v8.245" in sw,
              "own market heading": 'h.textContent="2. Kaufpreis-Check";' in index,
              "own financing heading": '"3. Finanzierung und Nebenkosten"' in index,
              "own finance card": 'financeCard.className="card own-finance-card";' in index,
              "flip financing restored": 'dealCard.insertBefore(financeDetails,goals);' in index,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Deployment verification failed: " + ", ".join(failed))

          print("Deployment verification passed:", ", ".join(checks))
          PY

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
