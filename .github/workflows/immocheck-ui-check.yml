name: Original backup restoration checks (no deploy)
on:
  workflow_dispatch:
  push:
    branches: [main, restore/original-with-current-brand-2026-11]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify original layout with retained branding
        run: |
          python3 -m pip install Pillow==12.0.0 PyYAML
          python3 - <<'PY'
          import yaml, subprocess
          from pathlib import Path
          workflow=yaml.safe_load(Path('.github/workflows/pages.yml').read_text())
          build=next(s['run'] for s in workflow['jobs']['deploy']['steps'] if s.get('name')=='Build static site')
          subprocess.run(['bash','-e','-c',build],check=True)
          PY
          node server/tests/run.cjs
      - name: Verify original calculators in Chromium
        run: |
          npm install --prefix /tmp/nic-original-check playwright@1.56.1 --silent
          /tmp/nic-original-check/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8766 --directory _site > /tmp/original-server.log 2>&1 &
          NODE_PATH=/tmp/nic-original-check/node_modules node scripts/verify_original_browser.cjs
